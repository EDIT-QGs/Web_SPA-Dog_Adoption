name: Deploy Web SPA

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Construir a Imagem Docker
        run: docker build -t dog-adoption-spa .

      - name: Limpar container antigo
        run: |
          docker stop dog-adoption-site || true
          docker rm dog-adoption-site || true

      - name: Subir o novo container
        run: docker run -d -p 80:80 --name dog-adoption-site dog-adoption-spa